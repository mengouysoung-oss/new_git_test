<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="asset/bootstrap/css/bootstrap.css">
    <link rel="stylesheet" href="asset/css/style.css">
    
</head>

<body>
    <header></header>
    <main>
        <!-- Hero section -->
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">Navbar</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="#">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Link</a>
                        </li>
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                                aria-expanded="false">
                                Dropdown
                            </a>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" href="#">Action</a></li>
                                <li><a class="dropdown-item" href="#">Another action</a></li>
                                <li>
                                    <hr class="dropdown-divider">
                                </li>
                                <li><a class="dropdown-item" href="#">Something else here</a></li>
                            </ul>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link disabled" aria-disabled="true">Disabled</a>
                        </li>
                    </ul>
                    <form class="d-flex" role="search">
                        <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" />
                        <button class="btn btn-outline-success" type="submit">Search</button>
                    </form>
                </div>
            </div>
        </nav>

        <!-- /About section -->
        <section class="py-5">
            <div class="container">
                <div class="row">
                    <div class="col-lg-6 justify-content-between">
                        <div class="herobanner">
                            <img src="https://i.pinimg.com/736x/39/de/0e/39de0eaf7622101816cc7b8c209b0a4d.jpg" alt="">
                        </div>
                    </div>
                    <div class="col-lg-5">
                        <form action="" method="" class="needs-validation" novalidate>
                            <h3>Register Account</h3>
                            <p>Create your account. Already have an account?<a href="">login</a></p>
                            <div class="row">
                                <div class="col-lg-6">
                                    <div class="mt-3">
                                        <label for="firstname" class="form-label">First Name</label>
                                        <input type="text" class="form-control" id="firstname" placeholder="e.g jonh"
                                            required>
                                        <div class="invalid-feedback">Please enter a username.</div>
                                        <div class="valid-feedback">good</div>
                                    </div>
                                </div>
                                <div class="col-lg-6">
                                    <div class="mt-3">
                                        <label for="Last Name" class="form-label">Last Name</label>
                                        <input type="text" class="form-control" id="lastname" placeholder="e.g Son"
                                            required>
                                        <div class="invalid-feedback">Please enter a username.</div>
                                        <div class="valid-feedback">good</div>
                                    </div>
                                </div>
                                <div class="col-lg-6">
                                    <div class="mt-3">
                                        <label for="pw" class="form-label">Password</label>
                                        <input type="password" class="form-control" id="password" placeholder="e.g 123"
                                            minlength="8"
                                            pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{8,}" required>
                                        <div class="invalid-feedback">Please enter a password.</div>
                                        <div class="valid-feedback">good</div>
                                    </div>
                                </div>
                                <div class="col-12">
                                    <label for="">Gender</label>
                                    <div class="row">
                                        <div class="col-6">
                                            <div class="mt-3">
                                                <div class="form-check">
                                                    <input type="radio" class="form-check-input" id="M" name="label">
                                                    <label for="M" class="form-label">Male</label>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-6">
                                            <div class="mt-3">
                                                <div class="form-check">
                                                    <input type="radio" class="form-check-input" id="F" name="label">
                                                    <label for="F" class="form-label">Female</label>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <label for="">Select your courses.</label>
                                    <div class="mt-3">
                                        <div class="form-check">
                                            <input type="checkbox" class="form-check-input" checked disabled>
                                            <label for="">Bootstrap</label>
                                        </div>
                                    </div>
                                    <div class="mt-3">
                                        <div class="form-check">
                                            <input type="checkbox" class="form-check-input">
                                            <label for="">HTML</label>
                                        </div>
                                    </div>
                                    <div class="mt-3">
                                        <div class="form-check">
                                            <input type="checkbox" class="form-check-input">
                                            <label for="">C++</label>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-12">
                                    <div class="row">
                                        <div class="col-6">
                                            <div class="mt-3">
                                                <button class="btn btn-danger" type="button">Cancel</button>
                                            </div>
                                        </div>
                                        <div class="col-6">
                                            <div class="mt-3">
                                                <button class="btn btn-primary w-100" type="submit">Create
                                                    Account</button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-12">
                                    <div class="mt-3">
                                        <label for="" class="form-label">Select your province.</label>
                                        <select name="" id="" class="form-select">
                                            <option value="" selected disabled>select your provinces</option>
                                            <option value="">Phnom Penh</option>
                                            <option value="">Seim Reab</option>
                                            <option value="">Kompong Cham</option>
                                            <option value="">Kompong chnang</option>
                                            <option value="">Kandal</option>
                                            <option value="">Kompong Thom</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="col-12">
                                    <div class="mt-3">
                                        <label for="" class="form-label">Date of birth</label>
                                        <input type="date" class="form-control" placeholder="dd/mm/yyyy">
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <script src="asset/bootstrap/js/bootstrap.js"></script>
</body>

</html>
